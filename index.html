<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vũ Trụ Kỷ Niệm 20/10 ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #16092b 0%, #070312 60%, #020108 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    #universe-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      z-index: 1;
    }

    #universe-canvas:active {
      cursor: grabbing;
    }

    /* Header lời chúc nổi trên vũ trụ */
    .hud-header {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      max-width: min(520px, calc(100vw - 48px));
      background: rgba(18, 8, 38, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 168, 226, 0.28);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 105, 180, 0.18);
    }

    .badge-2010 {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff5ca8, #b967ff);
      color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 0 12px rgba(255, 92, 168, 0.6);
    }

    .hud-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #ffb8e6, #d6b4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .hud-message {
      font-size: clamp(13px, 1.8vw, 15px);
      color: rgba(255, 240, 250, 0.9);
      line-height: 1.5;
    }

    .hud-sender {
      margin-top: 8px;
      font-size: 13px;
      color: #ff94d2;
      font-style: italic;
      font-weight: 600;
    }

    /* Thanh điều khiển góc trên bên phải */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 15;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-glass {
      pointer-events: auto;
      border: 1px solid rgba(255, 175, 230, 0.45);
      background: rgba(28, 12, 54, 0.72);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-glass:hover {
      background: linear-gradient(90deg, rgba(255, 92, 168, 0.85), rgba(166, 89, 255, 0.85));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 92, 168, 0.45);
    }

    /* Thanh zoom & hướng dẫn ở dưới */
    .bottom-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 8, 36, 0.68);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 180, 230, 0.3);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 190, 235, 0.4);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.2s;
    }

    .zoom-btn:hover {
      background: rgba(255, 92, 168, 0.7);
      transform: scale(1.08);
    }

    .hint-text {
      font-size: 12.5px;
      color: rgba(255, 230, 245, 0.85);
      padding: 0 6px;
    }

    /* Modal xem ảnh phóng to khi click vào ảnh trong vũ trụ */
    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6, 2, 15, 0.84);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .photo-lightbox.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .lightbox-card {
      position: relative;
      max-width: min(560px, 92vw);
      background: linear-gradient(145deg, rgba(40, 18, 72, 0.95), rgba(18, 7, 36, 0.98));
      border: 1px solid rgba(255, 168, 226, 0.5);
      border-radius: 22px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 92, 168, 0.35);
    }

    .lightbox-card img {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 14px;
      background: #0a0414;
    }

    .lightbox-caption {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #ffd6f0;
    }

    .lightbox-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #ff4da6;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 166, 0.6);
    }

    /* Modal chỉnh sửa tên, lời chúc & thêm ảnh */
    .editor-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 2, 14, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .editor-modal.active {
      display: flex;
    }

    .editor-box {
      width: min(600px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      background: #170b2c;
      border: 1px solid rgba(255, 160, 220, 0.45);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
      color: #fff;
    }

    .editor-box h2 {
      font-size: 20px;
      margin-bottom: 14px;
      color: #ffb3e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #e6c6ff;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 180, 235, 0.35);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .photo-upload-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #ff5ca8, #9b51e0);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-list-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
      padding: 6px;
      background: rgba(0, 0, 0, 0.
