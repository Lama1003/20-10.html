<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vũ Trụ Kỷ Niệm 20/10 ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #16092b 0%, #070312 60%, #020108 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    #universe-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      z-index: 1;
    }

    #universe-canvas:active {
      cursor: grabbing;
    }

    /* Header lời chúc nổi trên vũ trụ */
    .hud-header {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      max-width: min(520px, calc(100vw - 48px));
      background: rgba(18, 8, 38, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 168, 226, 0.28);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 105, 180, 0.18);
    }

    .badge-2010 {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff5ca8, #b967ff);
      color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 0 12px rgba(255, 92, 168, 0.6);
    }

    .hud-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #ffb8e6, #d6b4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .hud-message {
      font-size: clamp(13px, 1.8vw, 15px);
      color: rgba(255, 240, 250, 0.9);
      line-height: 1.5;
    }

    .hud-sender {
      margin-top: 8px;
      font-size: 13px;
      color: #ff94d2;
      font-style: italic;
      font-weight: 600;
    }

    /* Thanh điều khiển góc trên bên phải */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 15;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-glass {
      pointer-events: auto;
      border: 1px solid rgba(255, 175, 230, 0.45);
      background: rgba(28, 12, 54, 0.72);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-glass:hover {
      background: linear-gradient(90deg, rgba(255, 92, 168, 0.85), rgba(166, 89, 255, 0.85));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 92, 168, 0.45);
    }

    /* Thanh zoom & hướng dẫn ở dưới */
    .bottom-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 8, 36, 0.68);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 180, 230, 0.3);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 190, 235, 0.4);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.2s;
    }

    .zoom-btn:hover {
      background: rgba(255, 92, 168, 0.7);
      transform: scale(1.08);
    }

    .hint-text {
      font-size: 12.5px;
      color: rgba(255, 230, 245, 0.85);
      padding: 0 6px;
    }

    /* Modal xem ảnh phóng to khi click vào ảnh trong vũ trụ */
    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6, 2, 15, 0.84);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .photo-lightbox.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .lightbox-card {
      position: relative;
      max-width: min(560px, 92vw);
      background: linear-gradient(145deg, rgba(40, 18, 72, 0.95), rgba(18, 7, 36, 0.98));
      border: 1px solid rgba(255, 168, 226, 0.5);
      border-radius: 22px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 92, 168, 0.35);
    }

    .lightbox-card img {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 14px;
      background: #0a0414;
    }

    .lightbox-caption {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #ffd6f0;
    }

    .lightbox-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #ff4da6;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 166, 0.6);
    }

    /* Modal chỉnh sửa tên, lời chúc & thêm ảnh */
    .editor-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 2, 14, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .editor-modal.active {
      display: flex;
    }

    .editor-box {
      width: min(600px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      background: #170b2c;
      border: 1px solid rgba(255, 160, 220, 0.45);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
      color: #fff;
    }

    .editor-box h2 {
      font-size: 20px;
      margin-bottom: 14px;
      color: #ffb3e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #e6c6ff;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 180, 235, 0.35);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .photo-upload-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #ff5ca8, #9b51e0);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-list-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
      padding: 6px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
    }

    .photo-thumb {
      position: relative;
      height: 85px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 180, 235, 0.4);
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-thumb button {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 40, 100, 0.9);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-end;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ff4da6, #8a4fff);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-export {
      background: linear-gradient(90deg, #00c9a7, #009efa);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 640px) {
      .hud-header {
        top: 68px;
        left: 12px;
        right: 12px;
        max-width: none;
        padding: 12px 15px;
      }
      .top-actions {
        top: 12px;
        right: 12px;
      }
      .hint-text {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Khung hiển thị tên & lời chúc 20/10 -->
  <div class="hud-header">
    <span class="badge-2010">✨ Happy Vietnamese Women's Day 20/10 ✨</span>
    <h1 class="hud-title" id="display-title">Gửi Cậu - Vì Sao Rực Rỡ Nhất</h1>
    <p class="hud-message" id="display-message"></p>
    <div class="hud-sender" id="display-sender"></div>
  </div>

  <!-- Nút chỉnh sửa & tự động bay quanh vũ trụ -->
  <div class="top-actions">
    <button class="btn-glass" id="btn-toggle-orbit">🪐 Tự xoay: BẬT</button>
    <button class="btn-glass" id="btn-open-editor">✨ Điền Tên & Thêm Ảnh</button>
  </div>

  <!-- Thanh thu phóng vũ trụ -->
  <div class="bottom-controls">
    <button class="zoom-btn" id="btn-zoom-in" title="Phóng to vũ trụ">+</button>
    <button class="zoom-btn" id="btn-zoom-out" title="Thu nhỏ vũ trụ">−</button>
    <button class="zoom-btn" id="btn-reset-cam" title="Về góc nhìn ban đầu">⟲</button>
    <span class="hint-text">🖱️ Kéo để xoay 360° • Cuộn chuột / 2 ngón tay để Thu Phóng • Chạm vào ảnh để xem rõ</span>
  </div>

  <!-- Canvas Vũ Trụ 3D -->
  <canvas id="universe-canvas"></canvas>

  <!-- Hộp thoại phóng to ảnh khi bấm vào khung ảnh bay trong vũ trụ -->
  <div class="photo-lightbox" id="photo-lightbox">
    <div class="lightbox-card">
      <button class="lightbox-close" id="btn-close-lightbox">✕</button>
      <img id="lightbox-img" src="" alt="Kỷ niệm 20/10" />
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <!-- Hộp thoại Điền Tên, Lời Chúc & Thêm Ảnh -->
  <div class="editor-modal" id="editor-modal">
    <div class="editor-box">
      <h2>
        <span>🌸 Tuỳ Chỉnh Vũ Trụ 20/10</span>
        <button class="zoom-btn" id="btn-close-editor" style="width:30px;height:30px;font-size:14px;">✕</button>
      </h2>

      <div class="form-group">
        <label>Tên bạn nữ (Người nhận):</label>
        <input type="text" id="input-receiver" placeholder="VD: Nguyễn Thảo Linh" />
      </div>

      <div class="form-group">
        <label>Lời chúc 20/10:</label>
        <textarea id="input-message" placeholder="Nhập lời chúc 20/10 thật ngọt ngào..."></textarea>
      </div>

      <div class="form-group">
        <label>Tên của bạn (Người gửi):</label>
        <input type="text" id="input-sender" placeholder="VD: Từ một người luôn dõi theo cậu 💫" />
      </div>

      <div class="form-group">
        <label>Thêm ảnh kỷ niệm bay trong vũ trụ (Tải từ máy hoặc dán link):</label>
        <div class="photo-upload-row">
          <label class="file-label">
            📷 Chọn nhiều ảnh từ máy
            <input type="file" id="input-file-photos" accept="image/*" multiple style="display:none;" />
          </label>
          <input type="text" id="input-url-photo" placeholder="Hoặc dán link ảnh (https://...) rồi bấm Thêm" style="flex:1; min-width:180px;" />
          <button type="button" class="btn-primary" id="btn-add-url">Thêm Link</button>
        </div>
        <div class="photo-list-preview" id="photo-list-preview"></div>
      </div>

      <div class="editor-actions">
        <button type="button" class="btn-primary" id="btn-apply-changes">✨ Áp Dụng Ngay</button>
        <button type="button" class="btn-export" id="btn-export-html">💾 Xuất File HTML Đã Lưu Để Gửi Bạn</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       🌸 CẤU HÌNH VŨ TRỤ 20/10 (BẠN CÓ THỂ SỬA TRỰC TIẾP Ở ĐÂY HOẶC TRÊN WEB)
       ===================================================================== */
    const CAU_HINH_VU_TRU = {
      tenNguoiNhan: "Bông Hoa Xinh Đẹp Nhất Vũ Trụ",
      loiChuc20_10: "Chúc cậu một ngày 20/10 luôn rạng rỡ như những vì sao, ấm áp như mặt trời và mãi là hành tinh dịu dàng nhất trong vũ trụ của tớ. Hãy phóng to vũ trụ này để xem những khoảnh khắc đáng yêu nhé!",
      tenNguoiGui: "— Gửi từ người luôn quý mến cậu 💖",
      anNutChinhSua: false, // Đổi thành true nếu muốn ẩn nút "Điền Tên & Thêm Ảnh"
      danhSachAnh: [
        {
          url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
          chuThich: "Chúc cậu 20/10 ngập tràn niềm vui 🌸"
        },
        {
          url: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80",
          chuThich: "Luôn rạng rỡ như đóa hoa mùa xuân ✨"
        },
        {
          url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
          chuThich: "Mọi ước mơ đều bay cao giữa ngân hà 🪐"
        },
        {
          url: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80",
          chuThich: "Mỗi khoảnh khắc bên cậu đều lấp lánh 💖"
        },
        {
          url: "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=600&q=80",
          chuThich: "Bình yên và hạnh phúc mỗi ngày nhé 🌷"
        },
        {
          url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80",
          chuThich: "Vì sao sáng nhất đêm 20/10 🌟"
        }
      ]
    };

    /* =====================================================================
       🪐 HỆ THỐNG ĐỒ HỌA VŨ TRỤ 3D TƯƠNG TÁC (XOAY 360° & THU PHÓNG MƯỢT MÀ)
       ===================================================================== */
    const canvas = document.getElementById("universe-canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Trạng thái Camera 3D
    let camYaw = 0.3;
    let camPitch = 0.18;
    let camDist = 920; // Khoảng cách thu phóng (nhỏ = phóng to, lớn = thu nhỏ)
    let targetCamDist = 920;
    let autoRotate = true;

    // Dữ liệu thực thể trong vũ trụ
    const stars = [];
    const nebulae = [];
    const planets = [];
    let photoNodes = [];
    const shootingStars = [];

    // 1. Tạo 1200 ngôi sao lấp lánh trong không gian 3D
    for (let i = 0; i < 1200; i++) {
      const r = 400 + Math.random() * 2200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      stars.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta),
        z: r * Math.cos(phi),
        size: 0.7 + Math.random() * 2.2,
        color: ["#ffffff", "#ffd6f5", "#c8b6ff", "#a2d2ff", "#ffe5ec"][Math.floor(Math.random() * 5)],
        twinkleSpeed: 0.02 + Math.random() * 0.05,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }

    // 2. Tạo các đám mây tinh vân phát sáng (Nebula)
    for (let i = 0; i < 36; i++) {
      const r = 250 + Math.random() * 1100;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * 1.2;
      nebulae.push({
        x: r * Math.cos(theta) * Math.cos(phi),
        y: r * Math.sin(phi) * 380,
        z: r * Math.sin(theta) * Math.cos(phi),
        radius: 130 + Math.random() * 180,
        color: i % 2 === 0 ? "rgba(255, 92, 175, 0.07)" : "rgba(138, 79, 255, 0.07)"
      });
    }

    // 3. Tạo các hành tinh 3D (Hành tinh trung tâm 20/10 + các hành tinh vệ tinh)
    planets.push({
      name: "Hành Tinh 20/10",
      orbitRadius: 0,
      orbitSpeed: 0,
      angle: 0,
      yOffset: 0,
      radius: 78,
      color1: "#ff85c0",
      color2: "#7b2cbf",
      glowColor: "rgba(255, 92, 168, 0.55)",
      hasRing: true,
      ringColor: "rgba(255, 195, 235, 0.55)"
    });

    const planetConfigs = [
      { orbitRadius: 340, orbitSpeed: 0.004, radius: 28, color1: "#80ffdb", color2: "#5390d9", glowColor: "rgba(128,255,219,0.4)", hasRing: false, yOffset: -70 },
      { orbitRadius: 560, orbitSpeed: -0.0028, radius: 42, color1: "#ffcad4", color2: "#f4ACB7", glowColor: "rgba(255,202,212,0.45)", hasRing: true, ringColor: "rgba(255,230,240,0.45)", yOffset: 95 },
      { orbitRadius: 790, orbitSpeed: 0.002, radius: 34, color1: "#ffd166", color2: "#ef476f", glowColor: "rgba(255,209,102,0.4)", hasRing: false, yOffset: -110 },
      { orbitRadius: 1020, orbitSpeed: -0.0015, radius: 48, color1: "#bdb2ff", color2: "#4361ee", glowColor: "rgba(189,178,255,0.4)", hasRing: true, ringColor: "rgba(189,178,255,0.4)", yOffset: 60 }
    ];

    planetConfigs.forEach((p, idx) => {
      planets.push({
        ...p,
        angle: (idx * Math.PI) / 2 + 0.5
      });
    });

    // 4. Tạo các khung ảnh kỷ niệm bay lơ lửng trong vũ trụ
    function buildPhotoUniverse() {
      photoNodes = [];
      const list = CAU_HINH_VU_TRU.danhSachAnh;
      const total = Math.max(list.length, 1);
      // Nhân bản thành nhiều khung ảnh nhỏ bay khắp các quỹ đạo nếu ít ảnh
      const totalFrames = Math.max(total * 3, 18);

      for (let i = 0; i < totalFrames; i++) {
        const item = list[i % total];
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = item.url;

        // Phân bổ theo xoắn ốc ngân hà 3D
        const layer = i / totalFrames;
        const orbitR = 230 + layer * 880 + (Math.random() - 0.5) * 90;
        const angle = i * 1.15 + Math.random() * 0.4;
        const yPos = (Math.random() - 0.5) * 460;

        photoNodes.push({
          img,
          url: item.url,
          caption: item.chuThich || `Kỷ niệm 20/10 #${(i % total) + 1}`,
          orbitRadius: orbitR,
          angle: angle,
          orbitSpeed: (0.0012 + Math.random() * 0.0018) * (i % 2 === 0 ? 1 : -1),
          yBase: yPos,
          floatSpeed: 0.02 + Math.random() * 0.02,
          floatPhase: Math.random() * Math.PI * 2,
          baseSize: 64 + (i % 3) * 14,
          screenX: 0,
          screenY: 0,
          screenW: 0,
          screenH: 0,
          visible: false
        });
      }
    }

    // 5. Cập nhật giao diện chữ từ cấu hình
    function updateHUD() {
      document.getElementById("display-title").textContent = `Gửi ${CAU_HINH_VU_TRU.tenNguoiNhan} ✨`;
      document.getElementById("display-message").textContent = CAU_HINH_VU_TRU.loiChuc20_10;
      document.getElementById("display-sender").textContent = CAU_HINH_VU_TRU.tenNguoiGui;
      if (CAU_HINH_VU_TRU.anNutChinhSua) {
        document.getElementById("btn-open-editor").style.display = "none";
      }
    }

    // Phép chiếu 3D sang màn hình 2D
    function project3D(x, y, z) {
      // Xoay quanh trục Y (camYaw)
      const cosY = Math.cos(camYaw);
      const sinY = Math.sin(camYaw);
      const x1 = x * cosY - z * sinY;
      const z1 = z * cosY + x * sinY;

      // Xoay quanh trục X (camPitch)
      const cosP = Math.cos(camPitch);
      const sinP = Math.sin(camPitch);
      const y2 = y * cosP - z1 * sinP;
      const z2 = z1 * cosP + y * sinP + camDist;

      if (z2 <= 40) return { visible: false, x: 0, y: 0, scale: 0, depth: z2 };

      const fov = 750;
      const scale = fov / z2;
      return {
        visible: true,
        x: width / 2 + x1 * scale,
        y: height / 2 + y2 * scale,
        scale,
        depth: z2
      };
    }

    // Tạo sao băng ngẫu nhiên
    function spawnShootingStar() {
      if (shootingStars.length < 3 && Math.random() < 0.035) {
        shootingStars.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.5),
          vx: 8 + Math.random() * 7,
          vy: 4 + Math.random() * 5,
          len: 80 + Math.random() * 70,
          alpha: 1
        });
      }
    }

    // Vòng lặp dựng hình Vũ Trụ 3D
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 1;

      // Nội suy mượt khoảng cách thu phóng (Zoom)
      camDist += (targetCamDist - camDist) * 0.1;

      if (autoRotate && !isDragging) {
        camYaw += 0.0022;
      }

      ctx.clearRect(0, 0, width, height);

      // Vẽ sao băng nền
      spawnShootingStar();
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        ctx.save();
        const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.len, s.y - s.len * 0.5);
        grad.addColorStop(0, `rgba(255, 210, 245, ${s.alpha})`);
        grad.addColorStop(1, "rgba(255, 210, 245, 0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.len, s.y - s.len * 0.5);
        ctx.stroke();
        ctx.restore();

        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.018;
        if (s.alpha <= 0) shootingStars.splice(i, 1);
      }

      // 1. Vẽ các đám mây Tinh Vân (Nebula)
      nebulae.forEach(n => {
        const p = project3D(n.x, n.y, n.z);
        if (!p.visible) return;
        const r = n.radius * p.scale;
        if (r < 5) return;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, n.color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. Vẽ các vì sao lấp lánh
      stars.forEach(s => {
        const p = project3D(s.x, s.y, s.z);
        if (!p.visible) return;
        const twinkle = 0.45 + 0.55 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
        const radius = Math.max(0.5, s.size * p.scale * 1.2);
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // 3. Gom các Hành Tinh & Khung Ảnh vào chung danh sách để sắp xếp độ sâu Z (Painter's Algorithm)
      const renderQueue = [];

      planets.forEach((pl, idx) => {
        pl.angle += pl.orbitSpeed;
        const px = Math.cos(pl.angle) * pl.orbitRadius;
        const pz = Math.sin(pl.angle) * pl.orbitRadius;
        const py = pl.yOffset;
        const proj = project3D(px, py, pz);
        if (proj.visible) {
          renderQueue.push({ type: "planet", data: pl, proj, isCenter: idx === 0 });
        }
      });

      photoNodes.forEach(node => {
        node.angle += node.orbitSpeed;
        const nx = Math.cos(node.angle) * node.orbitRadius;
        const nz = Math.sin(node.angle) * node.orbitRadius;
        const ny = node.yBase + Math.sin(time * node.floatSpeed + node.floatPhase) * 18;
        const proj = project3D(nx, ny, nz);
        node.visible = proj.visible;
        if (proj.visible) {
          renderQueue.push({ type: "photo", data: node, proj });
        }
      });

      // Sắp xếp từ xa đến gần
      renderQueue.sort((a, b) => b.proj.depth - a.proj.depth);

      // 4. Vẽ Hành Tinh & Khung Ảnh theo đúng thứ tự chiều sâu 3D
      renderQueue.forEach(item => {
        const { proj } = item;

        if (item.type === "planet") {
          const pl = item.data;
          const r = pl.radius * proj.scale;
          if (r < 1.5) return;

          ctx.save();
          // Hào quang hành tinh
          const glow = ctx.createRadialGradient(proj.x, proj.y, r * 0.4, proj.x, proj.y, r * 2.4);
          glow.addColorStop(0, pl.glowColor);
          glow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, r * 2.4, 0, Math.PI * 2);
          ctx.fill();

          // Quả cầu hành tinh 3D
          const sphereGrad = ctx.createRadialGradient(
            proj.x - r * 0.35,
            proj.y - r * 0.35,
            r * 0.1,
            proj.x,
            proj.y,
            r
          );
          sphereGrad.addColorStop(0, "#ffffff");
          sphereGrad.addColorStop(0.25, pl.color1);
          sphereGrad.addColorStop(1, pl.color2);

          ctx.fillStyle = sphereGrad;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
          ctx.fill();

          // Vành đai hành tinh (Ring)
          if (pl.hasRing) {
            ctx.strokeStyle = pl.ringColor;
            ctx.lineWidth = Math.max(1.5, 4 * proj.scale);
            ctx.beginPath();
            ctx.ellipse(proj.x, proj.y, r * 1.85, r * 0.52, -0.28, 0, Math.PI * 2);
            ctx.stroke();
          }

          // Nhãn "20/10" ở hành tinh trung tâm
          if (item.isCenter && r > 18) {
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${Math.max(11, Math.round(r * 0.38))}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#ff4da6";
            ctx.shadowBlur = 12;
            ctx.fillText("20/10 💖", proj.x, proj.y);
          }
          ctx.restore();
        } else if (item.type === "photo") {
          const node = item.data;
          const size = node.baseSize * proj.scale;
          if (size < 6) {
            node.visible = false;
            return;
          }

          const w = size * 1.15;
          const h = size * 1.28;
          const x = proj.x - w / 2;
          const y = proj.y - h / 2;

          node.screenX = x;
          node.screenY = y;
          node.screenW = w;
          node.screenH = h;

          ctx.save();
          // Khung Polaroid phát sáng trong vũ trụ
          ctx.shadowColor = "rgba(255, 105, 190, 0.75)";
          ctx.shadowBlur = 14 * proj.scale;
          ctx.fillStyle = "rgba(255, 245, 252, 0.94)";
          roundRect(ctx, x, y, w, h, Math.max(3, 8 * proj.scale));
          ctx.fill();

          const pad = Math.max(2, w * 0.07);
          const imgW = w - pad * 2;
          const imgH = h - pad * 2.8;

          if (node.img.complete && node.img.naturalWidth > 0) {
            ctx.save();
            roundRect(ctx, x + pad, y + pad, imgW, imgH, Math.max(2, 5 * proj.scale));
            ctx.clip();
            ctx.drawImage(node.img, x + pad, y + pad, imgW, imgH);
            ctx.restore();
          } else {
            // Khung chờ nếu ảnh đang tải
            ctx.fillStyle = "#3a1c5e";
            ctx.fillRect(x + pad, y + pad, imgW, imgH);
          }

          // Trái tim nhỏ ở đáy khung ảnh Polaroid
          if (w > 28) {
            ctx.fillStyle = "#ff4da6";
            ctx.font = `${Math.max(8, Math.round(w * 0.12))}px sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("❤ 20/10", proj.x, y + h - pad * 0.7);
          }
          ctx.restore();
        }
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    /* =====================================================================
       🖱️ ĐIỀU KHIỂN XOAY 360°, THU PHÓNG (CHUỘT & CẢM ỨNG 2 NGÓN TAY)
       ===================================================================== */
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let dragDistance = 0;

    canvas.addEventListener("pointerdown", e => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dragDistance = 0;
    });

    window.addEventListener("pointermove", e => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      dragDistance += Math.abs(dx) + Math.abs(dy);
      camYaw += dx * 0.0055;
      camPitch = Math.max(-1.25, Math.min(1.25, camPitch + dy * 0.0055));
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener("pointerup", e => {
      if (isDragging && dragDistance < 10) {
        handleCanvasClick(e.clientX, e.clientY);
      }
      isDragging = false;
    });

    // Cuộn chuột để Phóng To / Thu Nhỏ xuyên qua vũ trụ
    window.addEventListener(
      "wheel",
      e => {
        if (e.target !== canvas) return;
        e.preventDefault();
        targetCamDist = Math.max(180, Math.min(2200, targetCamDist + e.deltaY * 0.85));
      },
      { passive: false }
    );

    // Chụm 2 ngón tay trên điện thoại để Phóng To / Thu Nhỏ
    let initialPinchDist = null;
    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
      }
    });

    canvas.addEventListener("touchmove", e => {
      if (e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const delta = initialPinchDist - dist;
        targetCamDist = Math.max(180, Math.min(2200, targetCamDist + delta * 2.2));
        initialPinchDist = dist;
      }
    });

    canvas.addEventListener("touchend", () => {
      initialPinchDist = null;
    });

    // Click vào ảnh nhỏ trong vũ trụ để xem ảnh phóng to
    function handleCanvasClick(mx, my) {
      // Kiểm tra từ ảnh gần nhất đến xa nhất
      const clickable = photoNodes
        .filter(n => n.visible && mx >= n.screenX && mx <= n.screenX + n.screenW && my >= n.screenY && my <= n.screenY + n.screenH)
        .sort((a, b) => b.screenW - a.screenW);

      if (clickable.length > 0) {
        const picked = clickable[0];
        document.getElementById("lightbox-img").src = picked.url;
        document.getElementById("lightbox-caption").textContent = picked.caption;
        document.getElementById("photo-lightbox").classList.add("active");
      }
    }

    document.getElementById("btn-close-lightbox").addEventListener("click", () => {
      document.getElementById("photo-lightbox").classList.remove("active");
    });

    document.getElementById("photo-lightbox").addEventListener("click", e => {
      if (e.target.id === "photo-lightbox") {
        document.getElementById("photo-lightbox").classList.remove("active");
      }
    });

    // Nút điều khiển dưới màn hình
    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      targetCamDist = Math.max(180, targetCamDist - 180);
    });
    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      targetCamDist = Math.min(2200, targetCamDist + 180);
    });
    document.getElementById("btn-reset-cam").addEventListener("click", () => {
      targetCamDist = 920;
      camYaw = 0.3;
      camPitch = 0.18;
    });

    const btnOrbit = document.getElementById("btn-toggle-orbit");
    btnOrbit.addEventListener("click", () => {
      autoRotate = !autoRotate;
      btnOrbit.textContent = autoRotate ? "🪐 Tự xoay: BẬT" : "🪐 Tự xoay: TẮT";
    });

    /* =====================================================================
       ✨ HỘP THOẠI ĐIỀN TÊN, LỜI CHÚC, THÊM ẢNH & XUẤT FILE HTML
       ===================================================================== */
    const editorModal = document.getElementById("editor-modal");
    const inputReceiver = document.getElementById("input-receiver");
    const inputMessage = document.getElementById("input-message");
    const inputSender = document.getElementById("input-sender");
    const photoPreviewContainer = document.getElementById("photo-list-preview");

    function renderPhotoThumbnails() {
      photoPreviewContainer.innerHTML = "";
      CAU_HINH_VU_TRU.danhSachAnh.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "photo-thumb";
        div.innerHTML = `
          <img src="${item.url}" alt="anh-${index}" />
          <button type="button" title="Xóa ảnh này" data-idx="${index}">✕</button>
        `;
        div.querySelector("button").addEventListener("click", () => {
          CAU_HINH_VU_TRU.danhSachAnh.splice(index, 1);
          renderPhotoThumbnails();
          buildPhotoUniverse();
        });
        photoPreviewContainer.appendChild(div);
      });
    }

    document.getElementById("btn-open-editor").addEventListener("click", () => {
      inputReceiver.value = CAU_HINH_VU_TRU.tenNguoiNhan;
      inputMessage.value = CAU_HINH_VU_TRU.loiChuc20_10;
      inputSender.value = CAU_HINH_VU_TRU.tenNguoiGui;
      renderPhotoThumbnails();
      editorModal.classList.add("active");
    });

    document.getElementById("btn-close-editor").addEventListener("click", () => {
      editorModal.classList.remove("active");
    });

    // Tải nhiều ảnh từ máy tính / điện thoại (tự động nén nhẹ sang Base64 để nhúng thẳng vào file HTML)
    document.getElementById("input-file-photos").addEventListener("change", e => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const offCanvas = document.createElement("canvas");
            const maxDim = 700;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            offCanvas.width = w;
            offCanvas.height = h;
            offCanvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const dataUrl = offCanvas.toDataURL("image/jpeg", 0.82);

            CAU_HINH_VU_TRU.danhSachAnh.push({
              url: dataUrl,
              chuThich: `Khoảnh khắc đáng nhớ của ${inputReceiver.value || "cậu"} 💖`
            });
            renderPhotoThumbnails();
            buildPhotoUniverse();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    });

    // Thêm ảnh bằng Link URL
    document.getElementById("btn-add-url").addEventListener("click", () => {
      const urlInput = document.getElementById("input-url-photo");
      const url = urlInput.value.trim();
      if (!url) return;
      CAU_HINH_VU_TRU.danhSachAnh.push({
        url,
        chuThich: `Kỷ niệm 20/10 ngọt ngào 🌸`
      });
      urlInput.value = "";
      renderPhotoThumbnails();
      buildPhotoUniverse();
    });

    // Áp dụng thay đổi
    function syncFormToConfig() {
      CAU_HINH_VU_TRU.tenNguoiNhan = inputReceiver.value.trim() || "Bạn Nữ Xinh Đẹp";
      CAU_HINH_VU_TRU.loiChuc20_10 = inputMessage.value.trim() || "Chúc cậu 20/10 luôn vui vẻ và tỏa sáng!";
      CAU_HINH_VU_TRU.tenNguoiGui = inputSender.value.trim() || "— Từ người luôn quý mến cậu 💖";
      updateHUD();
      buildPhotoUniverse();
    }

    document.getElementById("btn-apply-changes").addEventListener("click", () => {
      syncFormToConfig();
      editorModal.classList.remove("active");
    });

    // Xuất ra 1 file HTML hoàn chỉnh chứa sẵn ảnh & tên để gửi cho bạn nữ
    document.getElementById("btn-export-html").addEventListener("click", () => {
      syncFormToConfig();
      const exportConfig = {
        ...CAU_HINH_VU_TRU,
        anNutChinhSua: true
      };

      const currentHtml = document.documentElement.outerHTML;
      const updatedHtml = currentHtml.replace(
        /const CAU_HINH_VU_TRU = \{[\s\S]*?\};\n/,
        `const CAU_HINH_VU_TRU = ${JSON.stringify(exportConfig, null, 2)};\n`
      );

      const blob = new Blob(["<!DOCTYPE html>\n" + updatedHtml], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "vu_tru_20_10_tang_ban.html";
      link.click();
    });

    // Khởi chạy Vũ Trụ
    updateHUD();
    buildPhotoUniverse();
    animate();
  </script>
</body>
